<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Vinilo - Morgana Tienda Mística</title>
<style>
body {
  margin:0;
  background:#000;
  color:#fff;
  font-family:sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

.container { 
  text-align:center; 
  width:100%; 
}

/* === TU VINILO PERSONALIZADO === */
.vinyl {
  width: 380px;
  height: 380px;
  margin: 0 auto 40px auto;
  background: url('https://raw.githubusercontent.com/morgana-mistic/discos/main/DISCO%20MORGANA.png') center/contain no-repeat;
  border-radius: 50%;
  box-shadow: 
    0 0 80px rgba(255,255,255,0.3),
    inset 0 0 70px rgba(0,0,0,0.9);
  position: relative;
}

/* ANIMACIÓN DE GIRO */
.spin {
  animation: spin 3.5s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* VIDEO GRANDE */
.video-container {
  width: 95%;
  max-width: 920px;
  margin: auto;
}

.video-container iframe {
  width: 100%;
  height: 520px;
  border: none;
  border-radius: 12px;
  box-shadow: 0 0 40px rgba(255,255,255,0.15);
}

/* FIRMA / CONTACTO */
#firma{
  position:fixed;
  bottom:110px;
  left:50%;
  transform:translateX(-50%);
  z-index:999;
  text-align:center;

  font-size:1.30rem;
  font-weight:600;
}

#firma a{
  color:#fff;
  text-decoration:none;
  background:rgba(0,0,0,0.45);
  padding:12px 22px;
  border-radius:40px;
  box-shadow:0 4px 18px rgba(255,255,255,0.12);
}

#firma a:hover{
  opacity:1;
}

</style>
</head>

<body>

<div class="container">
  <div id="vinyl" class="vinyl"></div>
  <div id="player" class="video-container"></div>
</div>

<div id="firma">
  <a href="https://wa.me/5493854118422" target="_blank">
    ✨ Diseño digital por Morgana
  </a>
</div>

<script>

const params = new URLSearchParams(window.location.search);
let video = params.get("v");

/* CORRECCIÓN DE VIDEO ELIMINADO */
if(video === "ncvBut6QMPo"){
  video = "XNRv8uWAlWM";
}

if(video){
  document.getElementById("player").innerHTML = 
    `<iframe src="https://www.youtube.com/embed/${video}" allowfullscreen></iframe>`;
  document.getElementById("vinyl").classList.add("spin");
} else {
  document.getElementById("player").innerHTML = "<p>Sin video</p>";
}

</script>

<script data-goatcounter="https://morgana.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

</body>
</html>
