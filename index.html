
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Vinilo - Morgana Tienda Mística</title>
<style>
body {
  margin:0;
  background:#000;
  color:#fff;
  font-family:sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

.container { text-align:center; width:100%; }

/* === TU VINILO PERSONALIZADO === */
.vinyl {
  width: 380px;          /* Puedes cambiar el tamaño aquí */
  height: 380px;
  margin: 0 auto 40px auto;
  background: url('https://raw.githubusercontent.com/morgana-mistic/discos/main/DISCO%20MORGANA.png') center/contain no-repeat;
  border-radius: 50%;
  box-shadow: 
    0 0 80px rgba(255,255,255,0.3),
    inset 0 0 70px rgba(0,0,0,0.9);
  position: relative;
}

/* ANIMACIÓN DE GIRO */
.spin {
  animation: spin 3.5s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* VIDEO GRANDE */
.video-container {
  width: 95%;
  max-width: 920px;
  margin: auto;
}
.video-container iframe {
  width: 100%;
  height: 520px;
  border: none;
  border-radius: 12px;
  box-shadow: 0 0 40px rgba(255,255,255,0.15);
}
</style>
</head>
<body>
<div class="container">
  <div id="vinyl" class="vinyl"></div>
  <div id="player" class="video-container"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const video = params.get("v");

if(video){
  document.getElementById("player").innerHTML = 
    `<iframe src="https://www.youtube.com/embed/${video}" allowfullscreen></iframe>`;
  document.getElementById("vinyl").classList.add("spin");
} else {
  document.getElementById("player").innerHTML = "<p>Sin video</p>";
}
</script>
</body>
</html>
