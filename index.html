
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Vinilo</title>

<style>
body {
  margin:0;
  background:#000;
  color:#fff;
  font-family:sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* CONTENEDOR */
.container {
  text-align:center;
  width:100%;
}

/* VINILO */
.vinyl {
  width:200px;
  height:200px;
  margin:0 auto 20px auto;
  border-radius:50%;
  background:#111;
  border:8px solid #000;
  box-shadow:0 0 20px rgba(255,255,255,0.1);
  position:relative;
}

/* CENTRO */
.vinyl::after {
  content:"";
  width:50px;
  height:50px;
  background:#222;
  border-radius:50%;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

/* GIRO */
.spin {
  animation:spin 3s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* VIDEO GRANDE */
.video-container {
  width:90%;
  max-width:500px;
  margin:auto;
}

.video-container iframe {
  width:100%;
  height:280px;
  border:none;
}
</style>
</head>

<body>

<div class="container">

  <div id="vinyl" class="vinyl"></div>

  <div id="player" class="video-container"></div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const video = params.get("v");

if(video){
  document.getElementById("player").innerHTML =
    '<iframe src="https://www.youtube.com/embed/' + video + '" allowfullscreen></iframe>';

  document.getElementById("vinyl").classList.add("spin");

} else {
  document.getElementById("player").innerHTML = "Sin video";
}
</script>

</body>
</html>
