```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Vinilo</title>

<style>
body {
  margin:0;
  background:black;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:sans-serif;
  flex-direction:column;
}

/* VINILO */
.vinyl {
  width: 260px;
  height: 260px;
  border-radius: 50%;
  background: radial-gradient(circle, #222 0%, #000 60%);
  box-shadow: inset 0 0 30px rgba(255,255,255,0.05),
              0 0 30px rgba(0,0,0,0.8);
  margin-bottom: 25px;
  position: relative;
  animation: spin 6s linear infinite;
}

.vinyl::after {
  content: "";
  width: 70px;
  height: 70px;
  background: #111;
  border-radius: 50%;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

/* ANIMACIÓN */
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* REPRODUCTOR */
iframe {
  border:none;
  width: 360px;
  height: 215px;
  box-shadow: 0 0 25px rgba(255,255,255,0.08);
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="vinyl"></div>

<div id="player"></div>

<script>
const params = new URLSearchParams(window.location.search);
const video = params.get("v");

if(video){
  document.getElementById("player").innerHTML =
    `<iframe src="https://www.youtube.com/embed/${video}"
     allowfullscreen></iframe>`;
} else {
  document.getElementById("player").innerHTML =
    "Sin video";
}
</script>

</body>
</html>
```
