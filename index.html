
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Vinilo - Morgana Tienda Mística</title>
<style>
body {
  margin:0;
  background:#000;
  color:#fff;
  font-family:sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

.container { text-align:center; width:100%; }

/* VINILO NEGRO REALISTA */
.vinyl {
  width: 360px;
  height: 360px;
  margin: 0 auto 40px auto;
  background: url('https://i.ibb.co/0jZfK8Y/vinyl-real.png') center/contain no-repeat;
  border-radius: 50%;
  box-shadow: 
    0 0 70px rgba(255,255,255,0.25),
    inset 0 0 60px rgba(0,0,0,0.95);
  position: relative;
}

/* ETIQUETA CENTRAL PERSONALIZADA */
.vinyl::after {
  content: "MORGANA\nTIENDA MÍSTICA";
  width: 110px;
  height: 110px;
  background: #1a1a1a;
  border: 6px solid #ddd;
  border-radius: 50%;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: 11px;
  font-weight: bold;
  line-height: 1.1;
  color: #f0c040;
  text-shadow: 0 0 8px rgba(240, 192, 64, 0.8);
  box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
  z-index: 2;
}

/* ANIMACIÓN DE GIRO */
.spin {
  animation: spin 3.8s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* VIDEO GRANDE */
.video-container {
  width: 95%;
  max-width: 920px;
  margin: auto;
}
.video-container iframe {
  width: 100%;
  height: 520px;
  border: none;
  border-radius: 12px;
  box-shadow: 0 0 40px rgba(255,255,255,0.15);
}
</style>
</head>
<body>
<div class="container">
  <div id="vinyl" class="vinyl"></div>
  <div id="player" class="video-container"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const video = params.get("v");

if(video){
  document.getElementById("player").innerHTML = 
    `<iframe src="https://www.youtube.com/embed/${video}" allowfullscreen></iframe>`;
  document.getElementById("vinyl").classList.add("spin");
} else {
  document.getElementById("player").innerHTML = "<p>Sin video</p>";
}
</script>
</body>
</html>
