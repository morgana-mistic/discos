
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Vinilo</title>
<style>
body {
  margin:0;
  background:#000;
  color:#fff;
  font-family:sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow: hidden;
}

/* CONTENEDOR */
.container {
  text-align:center;
  width:100%;
}

/* VINILO MEJORADO - Más realista */
.vinyl {
  width: 260px;
  height: 260px;
  margin: 0 auto 30px auto;
  border-radius: 50%;
  background: 
    radial-gradient(circle at 50% 50%, #222 0%, #111 40%, #0a0a0a 70%, #000 100%),
    repeating-radial-gradient(circle at 50% 50%, 
      transparent 0px,
      rgba(255,255,255,0.08) 2px,
      transparent 4px);
  border: 12px solid #111;
  box-shadow: 
    0 0 40px rgba(255,255,255,0.15),
    inset 0 0 60px rgba(0,0,0,0.9),
    0 10px 30px rgba(0,0,0,0.8);
  position: relative;
  overflow: hidden;
}

/* Brillo en la superficie */
.vinyl::before {
  content: "";
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.25) 0%, transparent 50%);
  pointer-events: none;
  z-index: 2;
}

/* Etiqueta central (como los vinilos reales) */
.vinyl::after {
  content: "";
  width: 80px;
  height: 80px;
  background: linear-gradient(#111, #222, #111);
  border-radius: 50%;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  border: 4px solid #ddd;
  box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ddd;
  font-size: 11px;
  font-weight: bold;
  text-align: center;
  line-height: 1.1;
}

/* Texto en la etiqueta */
.vinyl::after::before {
  content: "VINILO";
  font-size: 9px;
}

/* ANIMACIÓN DE GIRO */
.spin {
  animation: spin 4s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* VIDEO */
.video-container {
  width: 90%;
  max-width: 500px;
  margin: auto;
}
.video-container iframe {
  width: 100%;
  height: 280px;
  border: none;
  border-radius: 8px;
}
</style>
</head>
<body>
<div class="container">
  <div id="vinyl" class="vinyl"></div>
  <div id="player" class="video-container"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const video = params.get("v");

if(video){
  document.getElementById("player").innerHTML =
    `<iframe src="https://www.youtube.com/embed/${video}" allowfullscreen></iframe>`;
  document.getElementById("vinyl").classList.add("spin");
} else {
  document.getElementById("player").innerHTML = "<p>Sin video</p>";
}
</script>
</body>
</html>
