
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Vinilo</title>
<style>
body {
  margin:0;
  background:#000;
  color:#fff;
  font-family:sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

.container {
  text-align:center;
  width:100%;
}

/* VINILO REALISTA CON IMAGEN */
.vinyl {
  width: 320px;          /* Tamaño del disco */
  height: 320px;
  margin: 0 auto 30px auto;
  background: url('https://pngimg.com/d/vinyl_PNG111.png') center/contain no-repeat;
  border-radius: 50%;
  box-shadow: 
    0 0 50px rgba(255,255,255,0.2),
    inset 0 0 40px rgba(0,0,0,0.8);
  position: relative;
}

/* ANIMACIÓN DE GIRO */
.spin {
  animation: spin 3.5s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* VIDEO MÁS GRANDE */
.video-container {
  width: 95%;
  max-width: 850px;     /* ← Puedes subir este número si querés aún más grande */
  margin: auto;
}
.video-container iframe {
  width: 100%;
  height: 480px;        /* ← Altura más grande */
  border: none;
  border-radius: 12px;
  box-shadow: 0 0 30px rgba(255,255,255,0.1);
}
</style>
</head>
<body>
<div class="container">
  <div id="vinyl" class="vinyl"></div>
  <div id="player" class="video-container"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const video = params.get("v");

if(video){
  document.getElementById("player").innerHTML =
    `<iframe src="https://www.youtube.com/embed/${video}" allowfullscreen></iframe>`;
  document.getElementById("vinyl").classList.add("spin");
} else {
  document.getElementById("player").innerHTML = "<p>Sin video</p>";
}
</script>
</body>
</html>
