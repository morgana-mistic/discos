
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Vinilo</title>

<style>
body {
  margin:0;
  background:black;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:sans-serif;
}

/* CONTENEDOR */
.container {
  text-align:center;
}

/* VINILO */
.vinyl {
  width: 240px;
  height: 240px;
  border-radius: 50%;
  background: radial-gradient(circle, #222 0%, #000 60%);
  margin: 0 auto 20px;
  position: relative;
}

/* CENTRO DEL VINILO */
.vinyl::after {
  content: "";
  width: 60px;
  height: 60px;
  background: #111;
  border-radius: 50%;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

/* ANIMACIÓN FORZADA */
.spin {
  animation: spin 4s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* REPRODUCTOR */
iframe {
  width: 90vw;
  max-width: 360px;
  height: 200px;
  border:none;
}
</style>
</head>

<body>

<div class="container">

  <div id="vinyl" class="vinyl"></div>

  <div id="player"></div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const video = params.get("v");

if(video){
  document.getElementById("player").innerHTML =
    `<iframe src="https://www.youtube.com/embed/${video}" allowfullscreen></iframe>`;

  // ACTIVAR GIRO SI HAY VIDEO
  document.getElementById("vinyl").classList.add("spin");

} else {
  document.getElementById("player").innerHTML = "Sin video";
}
</script>

</body>
</html>
